<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>泼墨坊</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="泼墨坊前台首页">
      <header class="topbar home-topbar">
        <div>
          <p class="eyebrow">AI 作图工坊</p>
          <h1>泼墨坊</h1>
        </div>
        <button class="ghost-button" id="resetDemoButton" type="button">重置</button>
      </header>

      <section class="home-hero" aria-label="作图入口">
        <div>
          <p class="eyebrow">选择场景</p>
          <h2>点一个模块，进入专属作图页</h2>
        </div>
        <span id="visibleCountLabel">0 个作图入口</span>
      </section>

      <section class="module-grid" id="moduleGrid" aria-label="作图模块"></section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./shared.js?v=smart-poster-20260609"></script>
    <script src="./app.js?v=smart-poster-20260609"></script>
  </body>
</html>
